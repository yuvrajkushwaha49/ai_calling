services:
  mysql:
    image: mysql:8.0
    container_name: realestate-crm-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-crm_root_password}
      MYSQL_DATABASE: realestate_crm
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-crm_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-p${DB_PASSWORD:-crm_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate-crm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql://crm_user:${DB_PASSWORD:-crm_password}@mysql:3306/realestate_crm
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "npx prisma db push && node dist/main"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: realestate-crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: realestate-crm-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql_data:
  uploads_data:
